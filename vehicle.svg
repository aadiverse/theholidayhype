<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" fill="none">
  <defs>
    <!-- Background Gradient: Dawn Mountains & Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDEEE0" />
      <stop offset="50%" stop-color="#F9DFD0" />
      <stop offset="100%" stop-color="#E8D4C8" />
    </linearGradient>

    <!-- Mountain Gradients -->
    <linearGradient id="mount1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1BDBC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#BBA5A4" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="mount2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B9A1A2" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#9C8485" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ground Terrace Gradient -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5ECE5" />
      <stop offset="100%" stop-color="#E3D7CE" />
    </linearGradient>

    <!-- Metallic Black Van Body Gradients -->
    <linearGradient id="vanBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2229" />
      <stop offset="40%" stop-color="#101317" />
      <stop offset="80%" stop-color="#080A0C" />
      <stop offset="100%" stop-color="#181C22" />
    </linearGradient>

    <!-- Van Gloss Reflection -->
    <linearGradient id="vanGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>

    <!-- Headlight Crystal Glow -->
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="url(#skyGrad)" />

  <!-- Distant Soft Mountains -->
  <path d="M0 480 Q 250 360 550 440 T 1200 390 L 1200 520 L 0 520 Z" fill="url(#mount1)" />
  <path d="M0 500 Q 320 410 700 480 T 1200 450 L 1200 550 L 0 550 Z" fill="url(#mount2)" />

  <!-- Scenic Terrace Ground -->
  <rect y="500" width="1200" height="180" fill="url(#groundGrad)" />
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#D8C9BE" stroke-width="2" />

  <!-- Artistic Script Calligraphy: Travel In Comfort, Explore More -->
  <g transform="translate(80, 140)">
    <text x="0" y="80" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif" font-size="82" font-weight="bold" fill="#11203E" transform="rotate(-7)">Travel</text>
    <text x="30" y="165" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif" font-size="80" font-weight="bold" fill="#11203E" transform="rotate(-7)">In Comfort,</text>
    <text x="20" y="255" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', cursive, sans-serif" font-size="86" font-weight="bold" fill="#11203E" transform="rotate(-7)">Explore More</text>
    
    <!-- Golden Swoosh Curve -->
    <path d="M30 330 Q 180 270 380 230" stroke="#C5A059" stroke-width="5" fill="none" stroke-linecap="round" />
  </g>

  <!-- VEHICLE SHADOW ON GROUND -->
  <ellipse cx="780" cy="560" rx="340" ry="35" fill="#000000" fill-opacity="0.35" filter="blur(10px)" />
  <ellipse cx="740" cy="565" rx="260" ry="20" fill="#000000" fill-opacity="0.5" filter="blur(4px)" />

  <!-- LUXURY TOURING VAN -->
  <g id="vehicle-van">
    <!-- Wheels -->
    <!-- Rear Wheel -->
    <g transform="translate(1010, 520)">
      <circle cx="0" cy="0" r="42" fill="#1A1C20" />
      <circle cx="0" cy="0" r="28" fill="#8E9AA8" />
      <circle cx="0" cy="0" r="16" fill="#333D47" />
      <circle cx="0" cy="0" r="8" fill="#D1D5DB" />
    </g>
    <!-- Front Wheel -->
    <g transform="translate(845, 545)">
      <circle cx="0" cy="0" r="48" fill="#111317" />
      <circle cx="0" cy="0" r="34" fill="#9CA3AF" />
      <circle cx="0" cy="0" r="20" fill="#374151" />
      <circle cx="0" cy="0" r="10" fill="#E5E7EB" />
      <!-- Rim spokes -->
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#E5E7EB" stroke-width="4" />
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#E5E7EB" stroke-width="4" />
    </g>

    <!-- Van Main Body (Metallic Black) -->
    <!-- Side & Front Compound Path -->
    <path d="
      M 530 395 
      C 540 330, 590 230, 660 170 
      C 710 130, 800 115, 870 120 
      C 940 125, 1020 150, 1050 200 
      C 1075 240, 1080 320, 1070 480 
      L 1060 510 
      L 970 510 
      C 965 470, 930 470, 925 510 
      L 770 525 
      C 765 480, 715 480, 710 535 
      L 470 545 
      L 450 495 
      C 455 450, 480 410, 530 395 Z" 
      fill="url(#vanBody)" />

    <!-- Side Panoramic Tinted Windows -->
    <path d="
      M 670 190 
      C 720 160, 780 155, 860 160 
      C 930 165, 1000 180, 1030 220 
      C 1045 250, 1050 320, 1050 370 
      L 880 390 
      L 670 370 
      C 660 300, 650 220, 670 190 Z" 
      fill="#0D1520" />
    <!-- Window Gloss Streak -->
    <path d="M 700 180 L 1020 220 L 1010 260 L 680 220 Z" fill="url(#vanGloss)" opacity="0.5" />

    <!-- Front Windshield -->
    <path d="
      M 545 370 
      C 560 310, 600 235, 650 185 
      L 695 365 
      L 545 370 Z" 
      fill="#0A1017" />
    <path d="M 570 320 L 640 200 L 655 210 L 590 340 Z" fill="#FFFFFF" opacity="0.35" />

    <!-- Aerodynamic Front Grille & Nose -->
    <g transform="translate(440, 380)">
      <!-- Front bumper contour -->
      <path d="M 0 110 C 20 80, 60 70, 120 70 L 190 70 C 230 70, 260 85, 270 115 L 260 160 C 240 170, 140 180, 20 170 Z" fill="#15191E" stroke="#2D3748" stroke-width="2" />

      <!-- Chrome Hexagonal Grille -->
      <rect x="35" y="78" width="200" height="65" rx="10" fill="#0D1117" stroke="#718096" stroke-width="3" />
      <line x1="40" y1="95" x2="230" y2="95" stroke="#4A5568" stroke-width="2" />
      <line x1="40" y1="115" x2="230" y2="115" stroke="#4A5568" stroke-width="2" />
      <line x1="40" y1="130" x2="230" y2="130" stroke="#4A5568" stroke-width="2" />

      <!-- Center Chrome Emblem Ring -->
      <circle cx="135" cy="112" r="16" fill="none" stroke="#CBD5E1" stroke-width="3" />

      <!-- Plate Recess -->
      <rect x="75" y="150" width="120" height="24" rx="4" fill="#05070A" stroke="#475569" stroke-width="1.5" />

      <!-- Left Headlamp Assembly (High Beam Glow) -->
      <g transform="translate(15, 60)">
        <path d="M 0 25 C 10 5, 30 0, 45 5 L 40 35 C 25 35, 10 32, 0 25 Z" fill="#F0F9FF" />
        <!-- Headlight halo -->
        <ellipse cx="22" cy="18" rx="35" ry="25" fill="url(#lightGlow)" />
        <circle cx="18" cy="18" r="8" fill="#FFFFFF" />
        <circle cx="32" cy="18" r="7" fill="#FFFFFF" />
      </g>

      <!-- Right Headlamp Assembly -->
      <g transform="translate(210, 65)">
        <path d="M 0 5 C 15 0, 35 5, 45 25 L 40 35 C 25 35, 10 30, 0 5 Z" fill="#F0F9FF" />
        <ellipse cx="22" cy="18" rx="30" ry="20" fill="url(#lightGlow)" />
        <circle cx="20" cy="18" r="8" fill="#FFFFFF" />
      </g>

      <!-- Fog lamps -->
      <circle cx="30" cy="155" r="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2" />
      <circle cx="240" cy="155" r="8" fill="#F8FAFC" stroke="#64748B" stroke-width="2" />
    </g>

    <!-- Side Mirror (Driver side) -->
    <path d="M 515 385 C 505 380, 495 390, 490 410 C 485 430, 500 440, 515 435 Z" fill="#0E1116" stroke="#334155" stroke-width="2" />

    <!-- Chrome Body Accent Line -->
    <path d="M 535 480 L 1060 460" stroke="#C5A059" stroke-width="2.5" opacity="0.8" />
  </g>
</svg>